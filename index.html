<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Receipt</title>
  <script>
    const cacheBustKey = "receipt-cache-bust";
    const requestUrl = new URL(window.location.href);
    const requestTimestamp = requestUrl.searchParams.get("timestamp");
    if (requestTimestamp && sessionStorage.getItem(cacheBustKey) === requestTimestamp) {
      sessionStorage.removeItem(cacheBustKey);
    } else {
      let timestamp = String(Date.now());
      if (timestamp === requestTimestamp) timestamp += "-1";
      requestUrl.searchParams.set("timestamp", timestamp);
      sessionStorage.setItem(cacheBustKey, timestamp);
      window.location.replace(requestUrl.href);
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    .page {
      width: min(100%, 608px);
      margin: 0 auto;
    }

    .receipt {
      position: relative;
      width: 100%;
      max-width: 608px;
      min-height: 1000px;
      overflow: hidden;
      padding: 28px;
      border: 0;
      border-radius: 0;
      background: #fff;
      color: #222;
      font-family: Arial, "Noto Sans Arabic", sans-serif;
    }

    .receipt::after {
      position: absolute;
      top: 48%;
      left: 50%;
      z-index: 0;
      color: rgb(206 54 74 / 6%);
      content: attr(data-watermark);
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(-24deg);
    }

    .receipt-content { position: relative; z-index: 1; }
    .demo-badge {
      position: absolute;
      top: 0;
      right: 0;
      border: 1px solid #f2c5cb;
      border-radius: 3px;
      padding: 3px 6px;
      background: rgb(255 245 246 / 92%);
      color: #a52e40;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .demo-badge:empty { display: none; }

    .receipt-heading { padding-top: 0; text-align: center; }
    .merchant { margin: 0; overflow-wrap: anywhere; font-size: 1.45rem; line-height: 1.2; }
    .merchant-ar { margin: 5px 0 0; font-size: 1rem; }
    .receipt-title { margin: 2px 0 0; font-size: 1rem; }
    .receipt-meta { margin-top: 30px; }
    .receipt-row { display: flex; justify-content: space-between; gap: 12px; line-height: 1.48; }
    .receipt-row > span { min-width: 0; overflow-wrap: anywhere; }
    .receipt-row > span:last-child { text-align: right; }
    .receipt-identifiers { margin-top: 8px; }
    .receipt-identifiers .receipt-row + .receipt-row { margin-top: 2px; }
    .receipt-payment { margin-top: 16px; font-weight: 700; }
    .receipt-payment .receipt-row + .receipt-row { margin-top: 12px; }
    .receipt-card { margin-top: 8px; font-weight: 700; }
    .amount-block { margin-top: 28px; }
    .amount-ar-label { margin: 0 0 8px; text-align: right; font-weight: 700; }
    .amount-row { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    .amount-label { margin: 16px 0 0; }
    .amount { margin: 4px 0 0; text-align: right; font-size: 1.15rem; font-weight: 700; }
    .status-block { margin-top: 18px; text-align: center; }
    .status-ar, .status { margin: 0; font-size: 1.15rem; font-weight: 700; }
    .status { display: block; padding: 0; background: none; color: inherit; }
    .verification { margin-top: 14px; text-align: center; }
    .verification-ar, .verification-en { margin: 0; font-size: 1.05rem; line-height: 1.6; }
    .approval-block { margin-top: 22px; }
    .approval-block .receipt-row { font-weight: 700; }
    .approval-block .receipt-row + .receipt-row { margin-top: 4px; }
    .approval-block .receipt-row:last-child { font-weight: 400; }
    .receipt-footer { margin: 32px 0 0; font-size: 0.95rem; line-height: 1.65; text-align: center; }
    .receipt-footer p { margin: 0 0 8px; }
    .receipt-footer .copy-label { margin-top: 12px; font-weight: 700; }
    .receipt-technical { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 38px; font-size: 0.82rem; line-height: 1.6; }
    .receipt-technical span:nth-child(3n + 2) { text-align: center; }
    .receipt-technical span:nth-child(3n) { text-align: right; }
    .receipt-custom-details { margin-top: 14px; font-size: 0.8rem; line-height: 1.5; overflow-wrap: anywhere; }
    .receipt-custom-details:empty { display: none; }
    .receipt-error { margin: 3rem 0; color: #a52e40; text-align: center; }

    @media print {
      :root { background: #fff; }
      .page { width: 100%; margin: 0; }
      .receipt { max-width: 608px; min-height: 1000px; margin: 0 auto; border: 0; }
      .receipt::after { color: rgb(206 54 74 / 6%); }
      body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="receipt" id="receipt" aria-label="Receipt" aria-live="polite">
      <div class="receipt-content">
        <span class="demo-badge" id="notice"></span>
        <div class="receipt-heading">
          <h2 class="merchant" id="merchant"></h2>
          <p class="merchant-ar" id="merchant-ar" lang="ar" dir="rtl"></p>
          <p class="receipt-title" id="merchant-location"></p>
        </div>
        <div class="receipt-meta">
          <div class="receipt-row"><span id="date"></span><span id="time"></span></div>
        </div>
        <div class="receipt-identifiers">
          <div class="receipt-row"><span id="transaction-id"></span><span id="order-id"></span></div>
          <div class="receipt-row"><span id="identifier-left"></span><span id="identifier-right"></span></div>
        </div>
        <div class="receipt-payment">
          <div class="receipt-row"><span id="payment-method"></span><span id="payment-method-ar" lang="ar" dir="rtl"></span></div>
          <div class="receipt-row"><span id="transaction-type"></span><span id="transaction-type-ar" lang="ar" dir="rtl"></span></div>
        </div>
        <div class="receipt-row receipt-card"><span id="card-number"></span><span id="card-expiry"></span></div>
        <div class="amount-block">
          <p class="amount-ar-label" id="amount-label-ar" lang="ar" dir="rtl"></p>
          <div class="amount-row"><span id="amount-ar"></span></div>
          <p class="amount-label" id="amount-label"></p>
          <p class="amount" id="amount"></p>
        </div>
        <div class="status-block">
          <p class="status-ar" id="status-ar" lang="ar" dir="rtl"></p>
          <p class="status" id="status"></p>
        </div>
        <div class="verification">
          <p class="verification-ar" id="verification-ar" lang="ar" dir="rtl"></p>
          <p class="verification-en" id="verification"></p>
        </div>
        <div class="approval-block">
          <div class="receipt-row"><span id="approval-code-ar"></span><span id="approval-label-ar" lang="ar" dir="rtl"></span></div>
          <div class="receipt-row"><span id="approval-label"></span><span id="approval-code"></span></div>
          <div class="receipt-row"><span id="footer-date"></span><span id="footer-time"></span></div>
        </div>
        <div class="receipt-footer">
          <p id="thank-you-ar" lang="ar" dir="rtl"></p>
          <p id="thank-you"></p>
          <p id="retain-ar" lang="ar" dir="rtl"></p>
          <p id="retain"></p>
          <p class="copy-label" id="copy-ar" lang="ar" dir="rtl"></p>
          <p class="copy-label" id="copy"></p>
        </div>
        <div class="receipt-technical">
          <span id="technical-1"></span><span id="technical-2"></span><span id="technical-3"></span>
          <span id="technical-4"></span><span id="technical-5"></span><span id="technical-6"></span>
        </div>
        <div class="receipt-custom-details" id="custom-details"></div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const receipt = document.getElementById("receipt");
    const aliases = {
      merchant: ["merchant", "merchant_name"],
      amount: ["amount", "total"],
      currency: ["currency"],
      transaction_id: ["transaction_id", "transactionId", "txn_id"],
      date: ["date", "datetime", "created_at"],
      status: ["status"],
      payment_method: ["payment_method", "method"],
      order_id: ["order_id", "orderId"],
      customer: ["customer", "customer_name"],
      description: ["description", "item"]
    };
    const defaultData = {
      notice: "DEMO · NOT PAYMENT PROOF",
      watermark: "DEMO",
      header: ["Manal Hamad AlMugbel", "الحزم", "AlHazm"],
      dateTime: ["23/11/2026", "13:41:38"],
      identifiers: [
        ["NCBB 104219500256", "5178057B00000000"],
        ["5499 000625 1.0.0", "231041380625"]
      ],
      payment: [["mada", "مدى"], ["PURCHASE", "شراء"]],
      card: ["4847 83** **** 6194", "03/29"],
      amount: ["مبلغ الشراء", "﷼١.٠٠", "PURCHASE AMOUNT", "﷼1.00"],
      status: ["مقبولة", "APPROVED"],
      verification: ["لا يتطلب التحقق", "NO VERIFICATION REQUIRED"],
      approval: [
        ["٢١٧١٢٧", "رمز الموافقة"],
        ["Approval Code", "217127"],
        ["23/11/2026", "13:41:38"]
      ],
      footer: [
        "شكرا لاستخدامك مدى",
        "THANK YOU FOR USING mada",
        "يرجى الاحتفاظ بالإيصال",
        "PLEASE RETAIN RECEIPT",
        "** نسخة العميل **",
        "** CUSTOMER COPY **"
      ],
      technical: [
        ["CONTACTLESS 000", "A0000002282010", "0000000000"],
        ["0000 80 420300", "410859D733A8DDD2", "03"]
      ],
      customDetails: ""
    };

    function getValue(key) {
      for (const alias of aliases[key]) {
        const value = params.get(alias);
        if (value !== null && value.trim() !== "") return value.trim();
      }
      return "";
    }

    function formatReceiptDate(value) {
      const isoDate = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return isoDate ? `${isoDate[3]}/${isoDate[2]}/${isoDate[1]}` : value;
    }

    function formatAmount(amount, currency) {
      if (!amount) return "—";
      const numericAmount = Number(amount.replace(/,/g, ""));
      if (!Number.isFinite(numericAmount)) return [amount, currency].filter(Boolean).join(" ");
      if (!currency) return new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(numericAmount);
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: currency.toUpperCase()
        }).format(numericAmount);
      } catch {
        return `${currency.toUpperCase()} ${amount}`;
      }
    }

    function createLegacyData() {
      const data = JSON.parse(JSON.stringify(defaultData));
      const dateValue = getValue("date");
      const dateAndTime = dateValue.match(/^(.*?)(?:\s+(\d{1,2}:\d{2}(?::\d{2})?))$/);
      const receiptDate = formatReceiptDate(dateAndTime ? dateAndTime[1] : dateValue);
      const amountValue = getValue("amount");
      const amount = formatAmount(amountValue, getValue("currency"));
      const transactionId = getValue("transaction_id");
      const orderId = getValue("order_id");
      const customer = getValue("customer");

      if (getValue("merchant")) data.header[0] = getValue("merchant");
      if (receiptDate) {
        data.dateTime[0] = receiptDate;
        data.approval[2][0] = receiptDate;
      }
      if (dateAndTime) {
        data.dateTime[1] = dateAndTime[2];
        data.approval[2][1] = dateAndTime[2];
      }
      if (transactionId) data.identifiers[0][0] = transactionId;
      if (orderId) data.identifiers[0][1] = orderId;
      if (getValue("payment_method")) data.payment[0][0] = getValue("payment_method");
      if (amountValue) data.amount[1] = data.amount[3] = amount;
      if (getValue("status")) data.status[1] = getValue("status");
      data.customDetails = [
        customer && customer !== data.card[0] ? `Customer: ${customer}` : "",
        getValue("description")
      ].filter(Boolean).join(" · ");
      return data;
    }

    function asText(value, path) {
      if (typeof value !== "string" && (typeof value !== "number" || !Number.isFinite(value))) {
        throw new TypeError(`${path} must be a string or number.`);
      }
      return String(value);
    }

    function readArray(value, path, shape) {
      if (!Array.isArray(value) || value.length !== shape[0]) {
        throw new TypeError(`${path} must contain ${shape[0]} item(s).`);
      }
      return value.map((item, index) => shape.length === 1
        ? asText(item, `${path}[${index}]`)
        : readArray(item, `${path}[${index}]`, shape.slice(1)));
    }

    function validateData(value) {
      const data = {
        notice: asText(value.notice, "notice"),
        watermark: asText(value.watermark, "watermark"),
        customDetails: asText(value.customDetails, "customDetails")
      };
      const fields = {
        header: [3],
        dateTime: [2],
        identifiers: [2, 2],
        payment: [2, 2],
        card: [2],
        amount: [4],
        status: [2],
        verification: [2],
        approval: [3, 2],
        footer: [6],
        technical: [2, 3]
      };

      for (const [field, shape] of Object.entries(fields)) {
        data[field] = readArray(value[field], field, shape);
      }
      return data;
    }

    function validateLineData(lines) {
      if (!Array.isArray(lines)) {
        throw new TypeError("receiptData must be a JSON array.");
      }

      const shapes = [3, 3, 2, 2, 2, 2, 2, 2, 4, 2, 2, 2, 2, 2, 6, 3, 3];
      if (lines.length !== shapes.length) {
        throw new TypeError(`receiptData must contain ${shapes.length} line(s).`);
      }

      lines.forEach((line, index) => {
        if (!Array.isArray(line) || line.length !== shapes[index]) {
          throw new TypeError(`receiptData[${index}] must contain ${shapes[index]} item(s).`);
        }
        line.forEach((value, itemIndex) => asText(value, `receiptData[${index}][${itemIndex}]`));
      });

      return {
        notice: lines[0][0],
        watermark: lines[0][1],
        customDetails: lines[0][2],
        header: lines[1],
        dateTime: lines[2],
        identifiers: [lines[3], lines[4]],
        payment: [lines[5], lines[6]],
        card: lines[7],
        amount: lines[8],
        status: lines[9],
        verification: lines[10],
        approval: [lines[11], lines[12], lines[13]],
        footer: lines[14],
        technical: [lines[15], lines[16]]
      };
    }

    function renderData(data) {
      const textById = {
        notice: data.notice,
        merchant: data.header[0],
        "merchant-ar": data.header[1],
        "merchant-location": data.header[2],
        date: data.dateTime[0],
        time: data.dateTime[1],
        "transaction-id": data.identifiers[0][0],
        "order-id": data.identifiers[0][1],
        "identifier-left": data.identifiers[1][0],
        "identifier-right": data.identifiers[1][1],
        "payment-method": data.payment[0][0],
        "payment-method-ar": data.payment[0][1],
        "transaction-type": data.payment[1][0],
        "transaction-type-ar": data.payment[1][1],
        "card-number": data.card[0],
        "card-expiry": data.card[1],
        "amount-label-ar": data.amount[0],
        "amount-ar": data.amount[1],
        "amount-label": data.amount[2],
        amount: data.amount[3],
        "status-ar": data.status[0],
        status: data.status[1],
        "verification-ar": data.verification[0],
        verification: data.verification[1],
        "approval-code-ar": data.approval[0][0],
        "approval-label-ar": data.approval[0][1],
        "approval-label": data.approval[1][0],
        "approval-code": data.approval[1][1],
        "footer-date": data.approval[2][0],
        "footer-time": data.approval[2][1],
        "thank-you-ar": data.footer[0],
        "thank-you": data.footer[1],
        "retain-ar": data.footer[2],
        retain: data.footer[3],
        "copy-ar": data.footer[4],
        copy: data.footer[5],
        "custom-details": data.customDetails
      };

      data.technical.flat().forEach((value, index) => {
        textById[`technical-${index + 1}`] = value;
      });
      for (const [id, text] of Object.entries(textById)) {
        document.getElementById(id).textContent = text;
      }
      receipt.dataset.watermark = data.watermark;
    }

    function showError(message) {
      receipt.removeAttribute("data-watermark");
      const error = document.createElement("p");
      error.className = "receipt-error";
      error.setAttribute("role", "alert");
      error.textContent = message;
      receipt.replaceChildren(error);
    }

    let data;
    const serializedData = params.get("receiptData");
    if (serializedData === null) {
      data = createLegacyData();
    } else {
      try {
        data = JSON.parse(serializedData);
      } catch {
        data = undefined;
        showError("Invalid receiptData. Provide a URL-encoded JSON array.");
      }

      if (data !== undefined) {
        try {
          data = validateLineData(data);
        } catch (error) {
          data = undefined;
          showError(error.message);
        }
      }
    }

    if (data !== undefined) {
      try {
        renderData(validateData(data));
      } catch (error) {
        showError(error.message);
      }
    }

  </script>
</body>
</html>
